[project]
name = "crypto-ml-allocation"
version = "0.1.0"
description = "Walk-forward ML strategy allocation research framework for cryptocurrency markets"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "xgboost>=1.7; python_version < '3.14'",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2"]
parquet = ["pyarrow>=15.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
